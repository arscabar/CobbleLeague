name: Publish matched client release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test core
        run: ./gradlew --no-daemon test build
      - name: Build and test synergy
        shell: bash
        run: |
          VERSION=$(python -c "import re;print(re.search(r\"version = '([^']+)'\",open('build.gradle').read()).group(1))")
          ./gradlew -p server-addons/cobble-synergy "-Pcobbleleague_jar=../../build/libs/cobbleleague-$VERSION.jar" --no-daemon test build
      - name: Package both addons
        run: python scripts/package_friends.py
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="v$(python -c "import json;print(json.load(open('dist/client-release.json'))['release'])")"
          fi
          EXPECTED="v$(python -c "import json;print(json.load(open('dist/client-release.json'))['release'])")"
          test "$TAG" = "$EXPECTED"
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > draft.txt 2>/dev/null; then
            if grep -q false draft.txt; then echo 'Release already published; keeping it immutable.'; exit 0; fi
          else
            gh release create "$TAG" --draft --title "CobbleLeague $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/cobbleleague-*.jar dist/cobblesynergy-*.jar dist/client-release.json dist/CobbleLeague-friends-*.zip dist/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --latest
